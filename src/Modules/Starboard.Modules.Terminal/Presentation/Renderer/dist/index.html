<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Starboard terminal</title>
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <header class="tab-strip">
      <div
        id="session-tabs"
        class="tab-list"
        role="tablist"
        aria-label="Terminal 세션"
      ></div>
      <button
        id="new-tab"
        class="new-tab"
        type="button"
        aria-label="새 terminal 탭"
        title="새 terminal 탭 (Ctrl+Shift+T)"
      >
        +
      </button>
    </header>
    <main
      id="terminal-workspace"
      class="terminal-workspace"
      aria-label="Starboard terminal workspace"
    ></main>
    <script src="./app.js"></script>
  </body>
</html>
